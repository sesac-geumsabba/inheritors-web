name: Build & Push Docker Images

# staging으로 PR을 열거나 새 커밋을 푸시할 때마다 web/api 이미지를 각각 빌드해서
# GHCR(ghcr.io/<owner>/inheritors-web, inheritors-api)에 태그 두 개로 올린다.
#   - <run_number>-<short_sha>: 이 빌드를 유일하게 가리키는 버전 태그. 롤백/고정 배포 시 사용.
#   - staging: 이 워크플로가 마지막으로 성공한 빌드를 항상 가리키는 태그. 평소 배포는 이걸 pull.
on:
  pull_request:
    branches: [staging]

jobs:
  build:
    # EC2가 arm64(Graviton/t4g)라 arm64 이미지가 필요하다. amd64 러너 + QEMU 크로스빌드는
    # npm ci/next build 같은 네이티브 작업이 에뮬레이션 때문에 극심하게 느려서(실측 8분+ 도
    # 안 끝남), GitHub가 제공하는 네이티브 arm64 hosted 러너를 바로 쓴다.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          # NEXT_PUBLIC_API_BASE_URL은 Next.js가 빌드 시점에 클라이언트 번들에 박아넣는 값이라
          # 여기서 build-arg로 넘겨야 한다 — infra/nginx/web.conf의 /api/ 프록시와 짝을 맞춤.
          - image: inheritors-web
            dockerfile: apps/web/Dockerfile
            build-args: NEXT_PUBLIC_API_BASE_URL=https://www.theinheritors.site/api
          - image: inheritors-api
            dockerfile: apps/api/Dockerfile
            build-args: ""
    steps:
      - uses: actions/checkout@v4

      - name: 버전 태그 계산
        id: version
        run: echo "tag=${{ github.run_number }}-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build-args }}
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.version.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:staging
          # scope를 이미지별로 나눠야 한다 — 기본 scope(공용)를 매트릭스 두 잡이 같이
          # 쓰면 web/api 캐시가 서로를 밀어내서(실측: 두 번째 빌드도 다시 느려짐) 매번
          # 사실상 캐시 없는 빌드가 된다.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # 이미지가 :staging 태그로 올라간 뒤 EC2에 SSH로 붙어 pull + up -d만 실행한다.
  # 리포 전체를 clone할 필요 없음 — 이미지는 GHCR에서 pull하므로 EC2_APP_DIR엔
  # infra/docker-compose.prod.yml + infra/.env.prod + apps/{web,api}/.env 만 있으면 된다.
  # (docs/DEPLOY.md 참고, EC2_APP_DIR 예: /home/ubuntu/theinheritors)
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ${{ secrets.EC2_APP_DIR }}/infra
            docker compose --env-file .env.prod -f docker-compose.prod.yml pull
            docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
