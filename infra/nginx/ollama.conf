# Ollama(popopododo/inheritors-ollama) 앞단 리버스 프록시.
# 배치: 이 파일을 EC2의 /etc/nginx/sites-available/ollama 로 복사하고
#   sudo ln -s /etc/nginx/sites-available/ollama /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# default(80, server_name _)와 server_name이 겹치면 안 되므로 아래 SERVER_NAME을
# 실제 서브도메인(예: ollama.yourdomain.com)으로 바꿔야 한다. 서브도메인이 없다면
# 파일 맨 아래 "도메인 없이 쓰는 경우" 대안 블록을 대신 사용한다.
#
# 전제: docker-compose의 ollama 서비스 포트가 "127.0.0.1:11434:11434"로 루프백에만
# 바인딩되어 있어야 한다(0.0.0.0으로 열려 있으면 이 nginx를 거치지 않고 EC2 IP:11434로
# 직접 붙어버려 아래 보호가 전부 무의미해진다 — infra/docker-compose.yml 참고).

server {
    listen 80;
    listen [::]:80;
    server_name ollama.yourdomain.com;  # TODO: 실제 서브도메인으로 교체

    # 이 인스턴스(t4g.nano)에서 직접 서빙할 계획이면, 모델(6.5GB)이 RAM 0.5GB에 못 올라가서
    # 컨테이너가 뜨자마자 OOM으로 죽는다 — 이 nginx 설정과는 별개로 Ollama 자체를 더 큰
    # 인스턴스(최소 8GB+ RAM 권장)에서 띄우고, 이 server_name은 그 프록시 대상으로 쓴다.
    location / {
        proxy_pass http://127.0.0.1:11434;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Ollama 응답은 토큰 단위 스트리밍(청크 전송)이라 버퍼링하면 첫 토큰이 늦게 뜨거나
        # 끝까지 모았다가 한번에 쏟아진다 — 반드시 꺼야 실시간 스트리밍이 유지된다.
        proxy_buffering off;
        proxy_cache off;

        # 답변 생성이 수십 초 걸릴 수 있어 nginx 기본 60s 타임아웃이면 응답 도중 끊긴다.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Ollama API에는 인증이 없어 이 경로를 그대로 노출하면 누구나 무료로 LLM을 돌릴 수
        # 있다. 호출하는 쪽(apps/api) IP가 고정이면 아래 allow/deny로 막는 게 가장 간단하고
        # 확실하다 — 애플리케이션 코드를 안 건드려도 된다.
        # allow 1.2.3.4;   # apps/api가 도는 서버의 고정 IP
        # deny all;
    }
}

# ── 도메인 없이 쓰는 경우 ──────────────────────────────────────────────
# 서브도메인을 아직 못 만들었다면 위 server{} 블록 대신, nginx가 별도 포트로 듣고
# 내부 컨테이너 포트로 넘기는 방식을 쓴다 (docker-compose의 ollama 포트는
# "127.0.0.1:11500:11434"처럼 다른 숫자로 바꿔서 아래 11434와 겹치지 않게 한다).
