# apps/web(Next.js, 컨테이너 포트 3100 — 3000/3001은 이 EC2에서 이미 다른 서비스가 점유 중)
# 앞단 리버스 프록시.
# 배치: 이 파일을 EC2의 /etc/nginx/sites-available/web 로 복사하고
#   sudo ln -s /etc/nginx/sites-available/web /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# 이후 certbot --nginx 실행하면 이 파일에 443/ssl 설정이 자동으로 덧붙는다 — 직접 추가할 필요 없음.

server {
    listen 80;
    listen [::]:80;
    server_name theinheritors.site www.theinheritors.site;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 챗봇 답변이 SSE로 스트리밍되므로 버퍼링을 끄지 않으면 토큰이 한번에 몰려서 나온다.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # apps/api(백엔드, 컨테이너 포트 8000)를 같은 도메인 하위 경로로 프록시.
    # 프론트가 https://도메인으로 뜨는데 API를 http://<IP>:8000로 직접 부르면 브라우저가
    # mixed content로 막는다 — 반드시 같은 origin(https)을 거치게 한다.
    # NEXT_PUBLIC_API_BASE_URL 빌드값과 짝을 맞춰야 함: https://www.theinheritors.site/api
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;   # 끝 슬래시: /api/ 접두어를 벗기고 백엔드에 전달
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
