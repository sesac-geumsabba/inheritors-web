services:
  web:
    build:
      context: ../
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ../apps/web/.env
    depends_on:
      - api

  api:
    build:
      context: ../
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../apps/api/.env
    depends_on:
      - ollama
    # DB는 단일 인스턴스(Supabase 등)를 DATABASE_URL로 연결
    # 법원/법제처 API 키도 이 env_file에서 관리

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    # 최초 기동 후 1회: docker compose exec ollama ollama pull hf.co/gchrisoh/EEVE-Korean-Instruct-10.8B-v1.0-Q4_K_M-GGUF
    # (heegyu 리포는 구버전 GGUF라 Ollama가 "not compatible with llama.cpp"로 거부함 — gguf-my-repo로 재양자화된 리포 사용)

volumes:
  ollama_models:
