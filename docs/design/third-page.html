<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>늘다 (Neulda) - 3. 챗봇 대화형 학습 & 용어/퀴즈 카드</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root {
      --primary: #f85029;
      --primary-dark: #d14734;
      --accent-yellow: #ffc700;
      --accent-blue: #3b91c8;
      --bg-cream: #f5f5f0;
      --bg-card: #ffffff;
      --text-main: #222222;
      --text-sub: #666666;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }

    body {
      background-color: #e5e5e0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: var(--text-main);
    }

    /* Mobile Container Wrapper */
    .app-container {
      width: 100%;
      max-width: 430px;
      height: 900px;
      max-height: 95vh;
      background-color: var(--bg-cream);
      border-radius: 36px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* Header */
    .app-header {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: white;
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }

    .chat-header-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar-mini {
      width: 36px;
      height: 36px;
      background: var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .header-text-name {
      font-weight: 800;
      font-size: 17px;
    }

    .header-status {
      font-size: 12px;
      color: #2e7d32;
      font-weight: 600;
    }

    .audio-mode-btn {
      background: #fff5f2;
      border: 1.5px solid var(--primary);
      color: var(--primary);
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Chat Messages Scroll Container */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .chat-message {
      display: flex;
      gap: 10px;
      max-width: 88%;
    }

    .chat-message.bot {
      align-self: flex-start;
    }

    .chat-message.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .msg-avatar {
      width: 40px;
      height: 40px;
      background: var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .msg-bubble {
      padding: 14px 18px;
      border-radius: 20px;
      font-size: 16px;
      line-height: 1.45;
      font-weight: 600;
      position: relative;
    }

    .chat-message.bot .msg-bubble {
      background: white;
      color: var(--text-main);
      border-top-left-radius: 4px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.04);
    }

    .chat-message.user .msg-bubble {
      background: var(--primary);
      color: white;
      border-top-right-radius: 4px;
      box-shadow: 0 4px 12px rgba(248, 80, 41, 0.25);
    }

    /* Inline Vocab / Quiz Card inside Chat */
    .vocab-card {
      background: #f0f7ff;
      border: 2px solid var(--accent-blue);
      border-radius: 18px;
      padding: 16px;
      margin-top: 8px;
      box-shadow: 0 4px 12px rgba(59, 145, 200, 0.15);
    }

    .vocab-word {
      font-size: 22px;
      font-weight: 900;
      color: var(--accent-blue);
      letter-spacing: 0.5px;
    }

    .vocab-pronounce {
      font-size: 14px;
      color: var(--text-sub);
      font-weight: 700;
      margin-bottom: 6px;
    }

    .vocab-desc {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
      background: white;
      padding: 10px;
      border-radius: 10px;
    }

    /* Bookmark Toggle Button */
    .bookmark-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 6px;
      font-size: 12px;
      color: #777;
      background: rgba(0,0,0,0.04);
      padding: 4px 10px;
      border-radius: 12px;
      cursor: pointer;
      border: none;
      font-weight: 700;
    }

    .bookmark-btn.active {
      background: #fff0eb;
      color: var(--primary);
    }

    /* Quick Option Response Buttons Area */
    .option-response-area {
      padding: 12px 16px;
      background: white;
      border-top: 1px solid rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      width: 100%;
      height: 48px;
      background: #f8f8f6;
      border: 2px solid #e2e2dc;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .option-btn:hover, .option-btn:active {
      border-color: var(--primary);
      background: #fff5f2;
      color: var(--primary);
    }

    /* Bottom Fixed 4-Tab Navigation */
    .bottom-nav {
      height: 72px;
      background: white;
      border-top: 1px solid rgba(0,0,0,0.08);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      align-items: center;
      text-align: center;
      padding: 0 8px;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-sub);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
    }

    .nav-item.active {
      color: var(--primary);
      font-weight: 800;
    }

    .nav-icon {
      font-size: 20px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <div class="app-header">
      <div class="chat-header-title">
        <div class="avatar-mini">🍊</div>
        <div>
          <div class="header-text-name">느리 (AI 도우미)</div>
          <div class="header-status">● 답변 준비 완료</div>
        </div>
      </div>
      <button class="audio-mode-btn" onclick="alert('음성 듣기 모드가 켜졌습니다 🎧')">
        🎧 듣기 모드
      </button>
    </div>

    <!-- Chat Messages -->
    <div class="chat-area" id="chatArea">

      <!-- Bot Message 1 -->
      <div class="chat-message bot">
        <div class="msg-avatar">🍊</div>
        <div>
          <div class="msg-bubble">
            반가워요! 오늘은 카페 키오스크 주문법에 나오는 필수 영어 단어를 알아볼까요? 😊
          </div>
        </div>
      </div>

      <!-- Bot Inline Vocab Card Message -->
      <div class="chat-message bot">
        <div class="msg-avatar">🍊</div>
        <div>
          <div class="msg-bubble">
            카페에서 음료를 가지고 나갈 때 쓰는 표현이에요!
            
            <div class="vocab-card">
              <div class="vocab-word">TAKE OUT</div>
              <div class="vocab-pronounce">[ 테이크 아웃 ]</div>
              <div class="vocab-desc">
                "매장에서 안 먹고 포장해서 가지고 가겠다"는 뜻이에요!
              </div>
            </div>

            <button class="bookmark-btn active" onclick="this.classList.toggle('active')">
              🔖 담아두기 완료
            </button>
          </div>
        </div>
      </div>

      <!-- User Response -->
      <div class="chat-message user">
        <div>
          <div class="msg-bubble">
            아하! 테이크아웃이 포장이군요!
          </div>
        </div>
      </div>

      <!-- Bot Quiz Message -->
      <div class="chat-message bot">
        <div class="msg-avatar">🍊</div>
        <div>
          <div class="msg-bubble">
            맞아요! 잘 이해하셨네요 👏<br>
            그럼 매장에서 먹고 가고 싶을 땐 어떤 버튼을 눌러야 할까요?
          </div>
        </div>
      </div>

    </div>

    <!-- Option Response Buttons (Senior Interaction Zone) -->
    <div class="option-response-area">
      <button class="option-btn" onclick="sendOption('매장 이용 / FOR HERE 선택하기')">
        🍵 매장 이용 (For Here) 선택하기
      </button>
      <button class="option-btn" onclick="sendOption('잘 모르겠어요, 다시 설명해 주세요!')">
        ❓ 잘 모르겠어요, 다시 알려주세요!
      </button>
    </div>

    <!-- Bottom Fixed 4-Tab Navigation -->
    <div class="bottom-nav">
      <a href="second-page.html" class="nav-item">
        <span class="nav-icon">📖</span>
        <span>오늘의 수업</span>
      </a>
      <a href="#" class="nav-item">
        <span class="nav-icon">🔄</span>
        <span>복습</span>
      </a>
      <a href="third-page.html" class="nav-item active">
        <span class="nav-icon">💬</span>
        <span>질문/챗봇</span>
      </a>
      <a href="first-page.html" class="nav-item">
        <span class="nav-icon">👤</span>
        <span>나의 정보</span>
      </a>
    </div>

  </div>

  <script>
    function sendOption(text) {
      const chatArea = document.getElementById('chatArea');
      
      // Add User Message
      const userMsg = document.createElement('div');
      userMsg.className = 'chat-message user';
      userMsg.innerHTML = `<div><div class="msg-bubble">${text}</div></div>`;
      chatArea.appendChild(userMsg);

      // Add Bot Feedback
      setTimeout(() => {
        const botMsg = document.createElement('div');
        botMsg.className = 'chat-message bot';
        botMsg.innerHTML = `
          <div class="msg-avatar">🍊</div>
          <div>
            <div class="msg-bubble">
              정답이에요! 🎉 '매장 이용'이나 'For Here'을 누르면 매장에서 드실 수 있답니다!
            </div>
          </div>
        `;
        chatArea.appendChild(botMsg);
        chatArea.scrollTop = chatArea.scrollHeight;
      }, 500);

      chatArea.scrollTop = chatArea.scrollHeight;
    }
  </script>
</body>
</html>
