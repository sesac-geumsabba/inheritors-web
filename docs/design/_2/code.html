<style>

        /* ScrollExpand Styles */
        .scroll-expand-container {

            margin-bottom: 2rem;

        .scroll-expand-sticky {

        }
        .scroll-expand-media {
            width: 100%;
            height: 100%;
            object-fit: cover; /* or contain depending on image */
            will-change: transform, clip-path;
            transform-origin: center center;
        }
        .scroll-expand-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            opacity: 0;
            transform: translateY(20px);
            will-change: opacity, transform;
            transition: opacity 0.3s ease-out, transform 0.3s ease-out;
        }
        
        .scroll-hint {
            position: absolute;
            bottom: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--color-on-surface-variant);
            animation: bounce 2s infinite;
            opacity: 1;
            transition: opacity 0.3s ease;
        }
        
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const scrollArea = document.getElementById('main-scroll-area');
        const container = document.getElementById('scroll-expand-section');
        const mediaCard = document.getElementById('media-card');
        const media = document.getElementById('scroll-media');
        const title = document.getElementById('scroll-title');
        const hint = document.getElementById('scroll-hint');
        const wrapper = document.querySelector('.scroll-expand-media-wrapper');
        const cardFrame = document.getElementById('card-frame');

        // Initial setup for the card to be centered and not full screen yet
        const startInset = 32; // px inset for the card initially
        const startRadius = 16; // px border radius initially
        
        // Easing function
        const smoothstep = (min, max, value) => {
            const x = Math.max(0, Math.min(1, (value - min) / (max - min)));
            return x * x * (3 - 2 * x);
        };

        const updateAnimation = () => {
            if (!scrollArea || !container) return;

            // Calculate scroll progress within the container's area
            const containerRect = container.getBoundingClientRect();
            const scrollAreaRect = scrollArea.getBoundingClientRect();
            
            // Calculate how far the container has scrolled up relative to its starting position
            // When containerRect.top == scrollAreaRect.top, progress is 0
            // When containerRect.bottom == scrollAreaRect.bottom (or similar threshold), progress is 1
            
            const totalScrollDistance = container.offsetHeight - scrollArea.clientHeight;
            
            // Adjust calculation based on standard scroll event vs position relative to viewport
            const scrollOffset = scrollArea.scrollTop;
            
            // Max scroll to complete animation
            const maxScroll = window.innerHeight * 0.5; // Complete animation after half screen scroll
            
            let progress = Math.min(1, Math.max(0, scrollOffset / maxScroll));
            const easedProgress = smoothstep(0, 1, progress);

            // Apply transforms
            if (easedProgress > 0) {
                // Expanding phase
                
                // 1. Remove padding from card frame to expand to edges
                const currentPadding = 16 * (1 - easedProgress);
                cardFrame.style.padding = `${currentPadding}px`;
                
                // 2. Reduce border radius
                const currentRadius = 16 * (1 - easedProgress);
                mediaCard.style.borderRadius = `${currentRadius}px`;
                wrapper.style.borderRadius = `${currentRadius * 0.75}px`;
                
                // 3. Remove backgrounds and borders as it expands
                mediaCard.style.backgroundColor = `rgba(253, 232, 240, ${1 - easedProgress})`;
                mediaCard.style.borderColor = `rgba(226, 189, 197, ${0.2 * (1 - easedProgress)})`;
                mediaCard.style.padding = `${32 * (1 - easedProgress)}px`;
                
                // 4. Change object fit and scale image slightly
                if (easedProgress > 0.8) {
                    media.style.objectFit = 'cover';
                    media.style.padding = '0';
                    media.style.backgroundColor = '#F52D81'; // brand-pink for final background
                } else {
                    media.style.objectFit = 'contain';
                    media.style.padding = `${16 * (1 - easedProgress)}px`;
                    media.style.backgroundColor = 'transparent';
                }
                
                // Scale image for effect
                const scale = 1 + (easedProgress * 0.1);
                media.style.transform = `scale(${scale})`;

                // Show title
                if (easedProgress > 0.5) {
                    const titleProgress = (easedProgress - 0.5) * 2;
                    title.style.opacity = titleProgress;
                    title.style.transform = `translateY(${20 * (1 - titleProgress)}px)`;
                } else {
                    title.style.opacity = 0;
                }

                // Hide hint
                hint.style.opacity = 1 - (easedProgress * 2);
                
            } else {
                // Reset to initial state
                cardFrame.style.padding = '1rem';
                mediaCard.style.borderRadius = '1rem';
                mediaCard.style.backgroundColor = 'rgb(253, 232, 240)';
                mediaCard.style.borderColor = 'rgba(226, 189, 197, 0.2)';
                mediaCard.style.padding = '2rem';
                
                wrapper.style.borderRadius = '0.75rem';
                
                media.style.objectFit = 'contain';
                media.style.padding = '1rem';
                media.style.backgroundColor = 'transparent';
                media.style.transform = 'scale(1)';
                
                title.style.opacity = 0;
                hint.style.opacity = 1;
            }
        };

        // Listen for scroll events on the main area
        scrollArea.addEventListener('scroll', () => {
            requestAnimationFrame(updateAnimation);
        });
        
        // Initial call
        updateAnimation();
    });
</script>
